# Build the documentation and publish it to GitHub Pages at https://docs.viliha.com.
#
# A pull request runs the checks and the build and stops there. `main` deploys.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # Pages authenticates the artifact upload with OIDC rather than a token.
  id-token: write

# One deploy at a time, and the newest wins. `cancel-in-progress: false` because cancelling a
# half-finished deploy is how a site ends up serving one build's HTML with another's assets.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is committed, and a deploy that resolves its own
      # dependency versions is a deploy that can differ from the one that was tested.
      - run: npm ci

      # `next typegen` first, because the typed-routes helpers the layouts use do not exist until it
      # has run and `tsc` would fail on a fresh checkout without them.
      - run: npm run types:check

      - run: npm run build

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site and sets its source to GitHub Actions on the first run. Without it
          # the step fails with `Get Pages site failed ... Not Found`, because the action only *reads*
          # the configuration and a repository where nobody opened Settings -> Pages has none.
          enablement: true

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          # `public/CNAME` and `public/.nojekyll` are copied into here by the export, and both have to
          # ship: Pages re-reads the domain on every deploy, and without `.nojekyll` it drops `_next/`
          # for beginning with an underscore, which serves the HTML with none of its CSS.
          path: out

      - id: deploy
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4
